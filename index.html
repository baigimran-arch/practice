<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Typing Game</title>
<style>
  body {
    font-family: sans-serif;
    background: #111;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
  }

  #game {
    text-align: center;
  }

  #word {
    font-size: 2.5rem;
    margin: 20px;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.4s ease;
  }

  #word.show {
    opacity: 1;
    transform: translateY(0);
  }

  #input {
    font-size: 1.5rem;
    padding: 10px;
    border-radius: 8px;
    border: none;
    outline: none;
  }

  #score {
    margin-top: 20px;
    font-size: 1.2rem;
  }

  .flash {
    animation: flash 0.3s;
  }

  @keyframes flash {
    0% { color: white; }
    50% { color: #00ff99; }
    100% { color: white; }
  }

  .shake {
    animation: shake 0.3s;
  }

  @keyframes shake {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-5px, 3px); }
    50% { transform: translate(5px, -3px); }
    75% { transform: translate(-3px, 2px); }
    100% { transform: translate(0, 0); }
  }
</style>
</head>
<body>

<div id="game">
  <div id="word"></div>
  <input id="input" type="text" autofocus autocomplete="off" />
  <div id="score">Score: 0</div>
</div>

<script>
const words = [
  "xin chào",
  "cảm ơn",
  "tôi là ai",
  "học tiếng Việt",
  "đi chơi",
  "javascript",
  "typing game"
];

let current = "";
let score = 0;

const wordEl = document.getElementById("word");
const inputEl = document.getElementById("input");
const scoreEl = document.getElementById("score");

function shakeScreen() {
  document.body.classList.add("shake");
  setTimeout(() => {
    document.body.classList.remove("shake");
  }, 300);
}

function resetInput() {
  // IME・履歴残り対策として強制リセット
  inputEl.value = "";
  inputEl.focus();
  inputEl.dispatchEvent(new Event("input"));
}

function newWord() {
  current = words[Math.floor(Math.random() * words.length)];

  wordEl.classList.remove("show");
  setTimeout(() => {
    wordEl.textContent = current;
    wordEl.classList.add("show");
  }, 150);

  resetInput();
}

inputEl.addEventListener("input", (e) => {
  const val = e.target.value;

  // ミス判定
  if (!current.startsWith(val)) {
    shakeScreen();
  }

  // 正解判定
  if (val.trim() === current) {
    score++;
    scoreEl.textContent = "Score: " + score;

    scoreEl.classList.add("flash");
    setTimeout(() => scoreEl.classList.remove("flash"), 300);

    resetInput();
    newWord();
  }
});

newWord();
</script>

</body>
</html>
