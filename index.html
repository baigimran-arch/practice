<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ベトナム語タイピングゲーム</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      font-family: Arial, sans-serif;
      color: #333;
    }

    .container {
      width: 90%;
      max-width: 700px;
      background: white;
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    .meaning {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: #666;
    }

    .word {
      font-size: 2rem;
      font-weight: bold;
      margin: 20px 0;
      letter-spacing: 2px;
    }

    .input-area {
      width: 100%;
      padding: 14px;
      font-size: 1.2rem;
      border: 2px solid #ddd;
      border-radius: 12px;
      outline: none;
      transition: 0.2s;
    }

    .input-area:focus {
      border-color: #ff7f50;
    }

    .status {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
    }

    .message {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 30px;
    }

    button {
      margin-top: 24px;
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      background: #ff7f50;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      background: #ff6333;
    }

    .correct {
      color: #2e8b57;
    }

    .wrong {
      color: #dc143c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🇻🇳 ベトナム語タイピングゲーム</h1>

    <div class="meaning" id="meaning">意味</div>
    <div class="word" id="word">Xin chào</div>

    <input
      type="text"
      id="input"
      class="input-area"
      placeholder="ここに入力"
      autocomplete="off"
    />

    <div class="message" id="message"></div>

    <div class="status">
      <div>スコア: <span id="score">0</span></div>
      <div>残り時間: <span id="time">30</span>秒</div>
    </div>

    <button id="startBtn">ゲーム開始</button>
  </div>

  <script>
    'use strict';

    const words = [
      {
        vietnamese: 'Xin chào',
        japanese: 'こんにちは'
      },
      {
        vietnamese: 'Cảm ơn',
        japanese: 'ありがとう'
      },
      {
        vietnamese: 'Tạm biệt',
        japanese: 'さようなら'
      },
      {
        vietnamese: 'Tôi yêu bóng đá',
        japanese: '私はサッカーが好きです'
      },
      {
        vietnamese: 'Bạn khỏe không',
        japanese: '元気ですか？'
      },
      {
        vietnamese: 'Ngon quá',
        japanese: 'めっちゃ美味しい'
      },
      {
        vietnamese: 'Chúc may mắn',
        japanese: '幸運を祈る'
      }
    ];

    const word = document.getElementById('word');
    const meaning = document.getElementById('meaning');
    const input = document.getElementById('input');
    const message = document.getElementById('message');
    const score = document.getElementById('score');
    const time = document.getElementById('time');
    const startBtn = document.getElementById('startBtn');

    let currentWord = {};
    let currentScore = 0;
    let currentTime = 30;
    let timerId = null;
    let playing = false;

    function randomWord() {
      return words[Math.floor(Math.random() * words.length)];
    }

    function showWord() {
      currentWord = randomWord();
      word.textContent = currentWord.vietnamese;
      meaning.textContent = currentWord.japanese;
    }

    function startGame() {
      currentScore = 0;
      currentTime = 30;
      playing = true;

      score.textContent = currentScore;
      time.textContent = currentTime;
      message.textContent = '';

      input.disabled = false;
      input.value = '';
      input.focus();

      showWord();

      clearInterval(timerId);

      timerId = setInterval(() => {
        currentTime--;
        time.textContent = currentTime;

        if (currentTime <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      playing = false;
      clearInterval(timerId);
      input.disabled = true;

      message.textContent = `ゲーム終了！ スコア: ${currentScore}`;
      message.className = 'message';
    }

    input.addEventListener('input', () => {
      if (!playing) {
        return;
      }

      if (input.value.trim() === currentWord.vietnamese) {
        currentScore++;
        score.textContent = currentScore;

        message.textContent = '正解！';
        message.className = 'message correct';

        input.value = '';
        showWord();
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && input.value.trim() !== currentWord.vietnamese) {
        message.textContent = '惜しい！';
        message.className = 'message wrong';
      }
    });

    startBtn.addEventListener('click', startGame);

    input.disabled = true;
  </script>
</body>
</html>
