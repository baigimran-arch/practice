<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vietnamese Flash Cards</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3f4f6;
      font-family: sans-serif;
    }

    .card {
      width: 90%;
      max-width: 360px;
      background: white;
      padding: 32px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 24px;
      margin-top: 0;
    }

    #japanese {
      font-size: 28px;
      font-weight: bold;
      margin: 32px 0 16px;
    }

    #vietnamese {
      font-size: 24px;
      color: #10b981;
      min-height: 40px;
      margin-bottom: 24px;
    }

    button {
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      margin: 6px;
    }

    .show {
      background: #3b82f6;
      color: white;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🇻🇳 ベトナム語単語帳</h1>

    <div id="japanese"></div>
    <div id="vietnamese"></div>

    <button class="show" id="showButton">答えを見る</button>
    <button class="next" id="nextButton">次へ</button>
  </div>

  <script>
    'use strict';

    const words = [
      {
        japanese: '休憩',
        vietnamese: 'Nghỉ giải lao'
      },
      {
        japanese: '急いでください',
        vietnamese: 'Xin hãy nhanh lên'
      },
      {
        japanese: 'ありがとうございます',
        vietnamese: 'Cảm ơn'
      },
      {
        japanese: 'お疲れさまです',
        vietnamese: 'Bạn vất vả rồi'
      }
    ];

    const japanese = document.getElementById('japanese');
    const vietnamese = document.getElementById('vietnamese');

    const showButton = document.getElementById('showButton');
    const nextButton = document.getElementById('nextButton');

    let currentIndex = 0;

    function showWord() {
      japanese.textContent = words[currentIndex].japanese;
      vietnamese.textContent = '';
    }

    showButton.addEventListener('click', () => {
      vietnamese.textContent = words[currentIndex].vietnamese;
    });

    nextButton.addEventListener('click', () => {
      currentIndex++;

      if (currentIndex >= words.length) {
        currentIndex = 0;
      }

      showWord();
    });

    showWord();
  </script>

</body>
</html>
